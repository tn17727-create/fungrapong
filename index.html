<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>เกมฟันกระป๋อง (MediaPipe + Three.js)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- MediaPipe Hands for Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Kanit', sans-serif;
            background-color: #1a202c; /* Tailwind gray-900 */
            color: white;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            /* Flip video horizontally so it acts like a mirror */
            transform: scaleX(-1);
            opacity: 0.5; /* Make it slightly transparent so 3D objects stand out */
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through if needed, though we use hands */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-text {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 1.5rem;
            font-weight: 600;
        }

        #score-display {
            color: #fbbf24; /* Tailwind amber-400 */
            font-size: 2rem;
        }
        
        #combo-display {
            color: #f87171; /* Tailwind red-400 */
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            transform: scale(0.8);
        }

        #combo-display.active {
            opacity: 1;
            transform: scale(1.2);
        }

        #lives-display {
            display: flex;
            gap: 10px;
        }

        .life-icon {
            color: #ef4444; /* red-500 */
            font-size: 2rem;
            text-shadow: 0 0 5px rgba(255,0,0,0.5);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto; /* Allow interaction with overlay */
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Kanit', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 12px rgba(59, 130, 246, 0.5);
        }

        #loading-text {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #9ca3af;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Slash trail canvas */
        #trail-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* Same as Three.js but draw on top or blend */
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Video for webcam feed -->
        <video id="webcam-video" autoplay playsinline></video>
        
        <!-- Canvas for 2D slash trails -->
        <canvas id="trail-canvas"></canvas>

        <!-- Container for Three.js (we'll append canvas here via JS) -->
        <div id="game-canvas"></div>

        <!-- UI Layer -->
        <div id="ui-layer">
            <div class="flex justify-between items-start w-full">
                <div class="flex flex-col">
                    <div class="hud-text">คะแนน: <span id="score-display">0</span></div>
                    <div id="combo-display" class="hud-text">คอมโบ x<span id="combo-count">1</span>!</div>
                </div>
                <div id="lives-display" class="hud-text">
                    <!-- Lives will be injected here -->
                </div>
            </div>
            
            <div class="text-center w-full pb-4">
                <div class="hud-text text-sm opacity-70">ใช้มือของคุณปัดผ่านวัตถุเพื่อฟัน!</div>
            </div>
        </div>

        <!-- Overlay for Start/Game Over/Loading -->
        <div id="overlay">
            <h1 id="main-title" class="text-6xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 text-center" style="line-height: 1.2;">
                Ninja Cans<br><span class="text-3xl text-white">ฟันกระป๋องทะลุมิติ</span>
            </h1>
            <p id="final-score-text" class="text-2xl mb-8 hidden">คะแนนของคุณ: <span id="final-score" class="text-yellow-400 font-bold">0</span></p>
            
            <button id="start-btn" class="btn btn-primary hidden">เริ่มเกม</button>
            <button id="restart-btn" class="btn btn-primary hidden">เล่นอีกครั้ง</button>
            
            <div id="loading-container" class="flex flex-col items-center">
                <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <div id="loading-text">กำลังโหลด AI จับการเคลื่อนไหว... กรุณาอนุญาตให้ใช้กล้อง</div>
            </div>
        </div>
    </div>

    <script>
        // --- Game State & Constants ---
        const GAME_STATE = {
            LOADING: 0,
            MENU: 1,
            PLAYING: 2,
            GAME_OVER: 3
        };
        let currentState = GAME_STATE.LOADING;

        let score = 0;
        let lives = 3;
        let combo = 0;
        let lastCutTime = 0;
        
        // Settings
        const MAX_LIVES = 3;
        const SPAWN_RATE_START = 1500; // ms
        let currentSpawnRate = SPAWN_RATE_START;
        const GRAVITY = -0.015;
        
        // Arrays to hold active objects
        let targets = [];
        let particles = [];
        
        // Tracking hand positions for trails and slicing
        let handPositions = []; // Store recent hand positions for trail
        const MAX_TRAIL_LENGTH = 15;
        let currentHandPos = { x: -100, y: -100 }; // screen coordinates
        let previousHandPos = { x: -100, y: -100 };

        // --- DOM Elements ---
        const videoElement = document.getElementById('webcam-video');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const loadingContainer = document.getElementById('loading-container');
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');
        const mainTitle = document.getElementById('main-title');
        const finalScoreText = document.getElementById('final-score-text');
        const finalScoreSpan = document.getElementById('final-score');
        const comboDisplay = document.getElementById('combo-display');
        const comboCountSpan = document.getElementById('combo-count');
        const trailCanvas = document.getElementById('trail-canvas');
        const trailCtx = trailCanvas.getContext('2d');

        // --- Resize Handling ---
        let screenW = window.innerWidth;
        let screenH = window.innerHeight;
        
        function resize() {
            screenW = window.innerWidth;
            screenH = window.innerHeight;
            
            // Update 2D Trail Canvas
            trailCanvas.width = screenW;
            trailCanvas.height = screenH;

            // Update 3D Camera & Renderer
            if (camera && renderer) {
                camera.aspect = screenW / screenH;
                camera.updateProjectionMatrix();
                renderer.setSize(screenW, screenH);
            }
        }
        window.addEventListener('resize', resize);
        resize(); // Initial sizing

        // --- STREAMING_CHUNK:Three.js Setup ---
        const container = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        
        // Add some subtle fog to blend into background
        scene.fog = new THREE.FogExp2(0x1a202c, 0.02);

        // Camera setup - looking straight down Z axis
        const camera = new THREE.PerspectiveCamera(60, screenW / screenH, 0.1, 1000);
        camera.position.z = 20;

        // Renderer with transparent background to see video
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(screenW, screenH);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- Materials for Targets ---
        const canGeometry = new THREE.CylinderGeometry(1, 1, 3, 16);
        const redMaterial = new THREE.MeshPhongMaterial({ color: 0xe11d48, shininess: 80 }); // Can
        const blueMaterial = new THREE.MeshPhongMaterial({ color: 0x3b82f6, shininess: 80 }); // Good Box
        const bombMaterial = new THREE.MeshPhongMaterial({ color: 0x1f2937, shininess: 20 }); // Bomb
        
        const boxGeometry = new THREE.BoxGeometry(2, 2, 2);
        const sphereGeometry = new THREE.SphereGeometry(1.2, 16, 16);

        // --- STREAMING_CHUNK:Game Logic Functions ---
        
        function updateLivesUI() {
            livesDisplay.innerHTML = '';
            for(let i=0; i<MAX_LIVES; i++) {
                if (i < lives) {
                    livesDisplay.innerHTML += '<span class="life-icon">❤️</span>';
                } else {
                    livesDisplay.innerHTML += '<span class="life-icon opacity-30">🖤</span>';
                }
            }
            
            if (lives <= 0 && currentState === GAME_STATE.PLAYING) {
                gameOver();
            }
        }

        function updateScore(points) {
            score += points;
            scoreDisplay.innerText = score;
            
            // Handle combo
            const now = performance.now();
            if (now - lastCutTime < 1000) { // If cut within 1 second of last cut
                combo++;
                if (combo > 1) {
                    comboCountSpan.innerText = combo;
                    comboDisplay.classList.add('active');
                    score += (combo * 2); // Bonus points for combo
                    
                    // Reset combo animation
                    setTimeout(() => {
                        comboDisplay.classList.remove('active');
                    }, 500);
                }
            } else {
                combo = 1;
                comboDisplay.classList.remove('active');
            }
            lastCutTime = now;
            scoreDisplay.innerText = score; // Update again in case combo added points
        }

        function spawnTarget() {
            if (currentState !== GAME_STATE.PLAYING) return;

            // Type: 0 = Can (Good), 1 = Box (Good), 2 = Bomb (Bad)
            const r = Math.random();
            let type = 0;
            let mesh;
            
            if (r > 0.8) {
                type = 2; // 20% Bomb
                mesh = new THREE.Mesh(sphereGeometry, bombMaterial);
                // Add fuse
                const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5), new THREE.MeshBasicMaterial({color:0xffa500}));
                fuse.position.y = 1.2;
                mesh.add(fuse);
            } else if (r > 0.4) {
                type = 1; // 40% Box
                mesh = new THREE.Mesh(boxGeometry, blueMaterial);
            } else {
                type = 0; // 40% Can
                mesh = new THREE.Mesh(canGeometry, redMaterial);
            }

            // Start position (bottom of screen)
            const startX = (Math.random() - 0.5) * 20; // Spread across X
            const startY = -15; // Below camera view
            mesh.position.set(startX, startY, 0);
            
            // Velocity (throw upwards and slightly inwards)
            const velX = -startX * 0.05 + (Math.random() - 0.5) * 0.1;
            const velY = 0.5 + Math.random() * 0.3; // Upward force
            
            // Rotation velocity
            const rotX = (Math.random() - 0.5) * 0.2;
            const rotY = (Math.random() - 0.5) * 0.2;
            const rotZ = (Math.random() - 0.5) * 0.2;

            scene.add(mesh);
            
            targets.push({
                mesh: mesh,
                type: type,
                vx: velX,
                vy: velY,
                rx: rotX,
                ry: rotY,
                rz: rotZ,
                sliced: false
            });

            // Schedule next spawn, getting faster over time
            currentSpawnRate = Math.max(500, currentSpawnRate * 0.99); // Floor at 500ms
            setTimeout(spawnTarget, currentSpawnRate);
        }

        // --- STREAMING_CHUNK:Particle & Slicing Effects ---
        function createParticles(x, y, z, colorHex) {
            const particleCount = 10;
            const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const material = new THREE.MeshBasicMaterial({ color: colorHex });

            for (let i = 0; i < particleCount; i++) {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, y, z);
                
                scene.add(mesh);
                particles.push({
                    mesh: mesh,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5 + 0.2, // Explode upwards a bit
                    vz: (Math.random() - 0.5) * 0.5,
                    life: 1.0 // 1 to 0
                });
            }
        }

        // Convert Normalized coordinates (0-1 from mediapipe) to 3D World space at z=0
        function getWorldPosFromNormalized(nx, ny) {
            // MediaPipe: x is 0(left) to 1(right), y is 0(top) to 1(bottom)
            // But our video is mirrored, so we need to flip X when mapped to world
            // ThreeJS: center is 0,0
            
            // Map normalized coordinates to screen pixel coordinates
            // Since we flipped the video via CSS, the raw normalized coordinates 
            // actually correspond to the physical right/left correctly if we don't flip them again in logic.
            // Actually, MediaPipe returns mirrored coordinates if selfieMode is false, 
            // but we will handle flipping in the options later. Let's assume nx, ny are correct screen-relative.
            
            const vector = new THREE.Vector3();
            // Convert to NDC (Normalized Device Coordinates: -1 to +1)
            vector.set((nx * 2) - 1, -(ny * 2) + 1, 0.5);
            
            // Unproject from camera
            vector.unproject(camera);
            
            // Calculate intersection with z=0 plane
            const dir = vector.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            
            return pos;
        }

        // --- STREAMING_CHUNK:Collision & Trail Logic ---
        function checkCollisions() {
            if (handPositions.length < 2) return;

            // Get line segment representing the latest swipe
            const p1Screen = handPositions[handPositions.length - 1]; // Latest
            const p2Screen = handPositions[0]; // Oldest in trail, gives a line

            if (!p1Screen || !p2Screen) return;
            
            // Calculate swipe speed
            const dx = p1Screen.x - p2Screen.x;
            const dy = p1Screen.y - p2Screen.y;
            const swipeDistSq = dx*dx + dy*dy;
            
            // Only cut if swiping fast enough
            if (swipeDistSq < 0.005) return; 

            // Convert to world pos for raycasting/math
            const p1 = getWorldPosFromNormalized(p1Screen.x, p1Screen.y);
            const p2 = getWorldPosFromNormalized(p2Screen.x, p2Screen.y);
            
            const line = new THREE.Line3(p1, p2);

            for (let i = targets.length - 1; i >= 0; i--) {
                const target = targets[i];
                if (target.sliced) continue;

                const tPos = target.mesh.position;
                
                // Simple distance from point to line check
                const closestPoint = new THREE.Vector3();
                line.closestPointToPoint(tPos, true, closestPoint);
                
                const dist = closestPoint.distanceTo(tPos);

                // If hand swipe line is close enough to target center
                if (dist < 2.0) { // Hit radius
                    target.sliced = true;
                    
                    if (target.type === 2) {
                        // Bomb hit!
                        lives--;
                        updateLivesUI();
                        createParticles(tPos.x, tPos.y, tPos.z, 0xff0000); // Red explosion
                        combo = 0; // Reset combo
                        
                        // Screen flash effect
                        document.body.style.backgroundColor = "red";
                        setTimeout(() => document.body.style.backgroundColor = "#1a202c", 100);
                        
                    } else {
                        // Good hit!
                        let points = target.type === 0 ? 10 : 15;
                        updateScore(points);
                        
                        let color = target.type === 0 ? 0xe11d48 : 0x3b82f6;
                        createParticles(tPos.x, tPos.y, tPos.z, color);
                        
                        // Split mesh visually (simplified: scale it down quickly before removal)
                        // In a full game, you'd replace it with two halves meshes
                    }
                }
            }
        }

        function drawTrail() {
            trailCtx.clearRect(0, 0, screenW, screenH);
            
            if (handPositions.length < 2) return;

            trailCtx.beginPath();
            
            // Map normalized coordinates to screen pixels
            const startX = handPositions[0].x * screenW;
            const startY = handPositions[0].y * screenH;
            
            trailCtx.moveTo(startX, startY);

            for (let i = 1; i < handPositions.length; i++) {
                const px = handPositions[i].x * screenW;
                const py = handPositions[i].y * screenH;
                
                // Use quadratic curves for smoother trail
                const prevX = handPositions[i-1].x * screenW;
                const prevY = handPositions[i-1].y * screenH;
                
                const cpX = (prevX + px) / 2;
                const cpY = (prevY + py) / 2;
                
                trailCtx.quadraticCurveTo(prevX, prevY, cpX, cpY);
            }
            
            // Final point
            const lastPx = handPositions[handPositions.length-1].x * screenW;
            const lastPy = handPositions[handPositions.length-1].y * screenH;
            trailCtx.lineTo(lastPx, lastPy);

            // Style the trail
            trailCtx.lineWidth = 8;
            trailCtx.lineCap = 'round';
            trailCtx.lineJoin = 'round';
            
            // Gradient based on speed/position
            const gradient = trailCtx.createLinearGradient(startX, startY, lastPx, lastPy);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
            gradient.addColorStop(1, 'rgba(200, 255, 255, 0.8)'); // Glow color
            
            trailCtx.strokeStyle = gradient;
            trailCtx.stroke();
            
            // Add a glow effect
            trailCtx.shadowBlur = 15;
            trailCtx.shadowColor = 'cyan';
            trailCtx.stroke();
            
            // Reset shadow for next frame
            trailCtx.shadowBlur = 0;
        }

        // --- STREAMING_CHUNK:Main Game Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Update hand positions array (decay)
            if (handPositions.length > 0) {
                // If hand hasn't moved, slowly clear trail
                if (currentHandPos.x === previousHandPos.x && currentHandPos.y === previousHandPos.y) {
                    handPositions.shift();
                } else {
                    previousHandPos = { ...currentHandPos };
                }
            }
            drawTrail();

            if (currentState === GAME_STATE.PLAYING) {
                checkCollisions();
            }

            // Update Targets
            for (let i = targets.length - 1; i >= 0; i--) {
                const target = targets[i];
                
                if (target.sliced) {
                    // Shrink out effect
                    target.mesh.scale.multiplyScalar(0.8);
                    if (target.mesh.scale.x < 0.1) {
                        scene.remove(target.mesh);
                        targets.splice(i, 1);
                    }
                    continue;
                }

                // Apply physics
                target.vy += GRAVITY;
                target.mesh.position.x += target.vx;
                target.mesh.position.y += target.vy;
                
                target.mesh.rotation.x += target.rx;
                target.mesh.rotation.y += target.ry;
                target.mesh.rotation.z += target.rz;

                // Remove if falls below screen
                if (target.mesh.position.y < -20) {
                    scene.remove(target.mesh);
                    targets.splice(i, 1);
                    
                    // Penalty for dropping good targets
                    if (target.type !== 2 && currentState === GAME_STATE.PLAYING) {
                        lives--;
                        updateLivesUI();
                        combo = 0;
                    }
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                
                p.vy += GRAVITY * 1.5;
                p.mesh.position.x += p.vx;
                p.mesh.position.y += p.vy;
                p.mesh.position.z += p.vz;
                
                p.life -= 0.02;
                p.mesh.scale.setScalar(p.life);
                
                // Rotate particles
                p.mesh.rotation.x += 0.1;
                p.mesh.rotation.y += 0.1;

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }
        
        // Start ThreeJS loop immediately to show background
        animate();

        // --- STREAMING_CHUNK:Game Control Functions ---
        
        function startGame() {
            score = 0;
            lives = MAX_LIVES;
            combo = 0;
            currentSpawnRate = SPAWN_RATE_START;
            
            // Clear existing objects
            targets.forEach(t => scene.remove(t.mesh));
            targets = [];
            particles.forEach(p => scene.remove(p.mesh));
            particles = [];
            
            updateScore(0);
            updateLivesUI();
            
            overlay.style.display = 'none';
            currentState = GAME_STATE.PLAYING;
            
            spawnTarget();
        }

        function gameOver() {
            currentState = GAME_STATE.GAME_OVER;
            
            finalScoreSpan.innerText = score;
            
            mainTitle.innerHTML = 'Game Over';
            mainTitle.classList.remove('from-blue-400', 'to-purple-500');
            mainTitle.classList.add('from-red-500', 'to-orange-500');
            
            finalScoreText.classList.remove('hidden');
            startBtn.classList.add('hidden');
            restartBtn.classList.remove('hidden');
            loadingContainer.classList.add('hidden');
            
            overlay.style.display = 'flex';
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // --- STREAMING_CHUNK:MediaPipe Hands Setup ---
        
        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Use the first hand detected
                const landmarks = results.multiHandLandmarks[0];
                
                // Use index finger tip (landmark 8) as the sword tip
                const indexTip = landmarks[8];
                
                // Note: Since we flip the video in CSS (transform: scaleX(-1)), 
                // the camera image matches a mirror. MediaPipe's output x is 0-1 from left-to-right of original image.
                // To map it correctly to our mirrored screen, we need to invert X.
                const mappedX = 1.0 - indexTip.x;
                const mappedY = indexTip.y;
                
                currentHandPos = { x: mappedX, y: mappedY };
                
                handPositions.push(currentHandPos);
                if (handPositions.length > MAX_TRAIL_LENGTH) {
                    handPositions.shift();
                }
            } else {
                // Decay trail if no hand detected
                if (handPositions.length > 0) {
                     handPositions.shift();
                }
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1, // Track 1 hand for performance
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5,
            selfieMode: false // We handle mirroring via CSS and coordinate mapping
        });
        
        hands.onResults(onResults);

        const camera_mp = new Camera(videoElement, {
            onFrame: async () => {
                // Wait for AI to load and process frame
                try {
                    await hands.send({image: videoElement});
                    
                    // If this is the first successful frame and we are in loading state
                    if (currentState === GAME_STATE.LOADING) {
                        currentState = GAME_STATE.MENU;
                        loadingContainer.classList.add('hidden');
                        startBtn.classList.remove('hidden');
                    }
                } catch (e) {
                    console.error("MediaPipe error:", e);
                }
            },
            width: 640,
            height: 480
        });

        // Start webcam and AI
        camera_mp.start().catch(err => {
            console.error("Camera start error:", err);
            loadingContainer.innerHTML = `<div class="text-red-500 font-bold p-4 text-center">
                ไม่สามารถเข้าถึงกล้องได้<br>กรุณาอนุญาตให้เว็บเบราว์เซอร์ใช้งานกล้องของคุณ
            </div>`;
        });

    </script>
</body>
</html>
